<section class="section section--soft" id="products">
  <div class="container">
    <div class="product-head reveal">
      <div>
        <div class="eyebrow">Our products</div>
        <h2 class="section-title">Indian products for global buyers.</h2>
      </div>
      <p class="section-copy">Explore our export categories and send an enquiry for product specifications, packing and destination requirements.</p>
    </div>
    <div class="product-grid reveal" id="categoryCards"></div>
    <div class="catalog-shell" id="catalogShell">
      <div class="catalog-panel">
        <div class="catalog-sidebar">
          <h4>Product categories</h4>
          <div class="catalog-side-list" id="catalogCategoryList"></div>
        </div>
        <div class="catalog-main">
          <div class="catalog-main-head">
            <div>
              <h3 id="catalogTitle">Products</h3>
              <p class="catalog-copy" id="catalogDescription"></p>
              <div class="breadcrumbs" id="catalogBreadcrumbs"></div>
            </div>
            <button class="btn btn--dark" id="closeCatalogBtn" type="button">Close ✕</button>
          </div>
          <div class="item-grid" id="productItems"></div>
        </div>
      </div>
    </div>
  </div>
</section>
